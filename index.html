<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Om de beurt</title>
<meta name="theme-color" content="#2F6B4E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: één telefoonkolom (max 480px), vaste menubalk onderin, veld als tactiekbord. */
:root {
  --bg:#F3F4EF; --card:#FFFFFF; --line:#DCDFD6; --sub:#ECEEE8; --ink:#14211B; --mut:#56615A;
  --prim:#14211B; --primTxt:#FFFFFF; --acc:#2F6B4E; --accTxt:#FFFFFF; --soft:#E3EEE7; --mid:#A9CDB8;
  --field:#2F6B4E; --fieldTxt:#DCEBE2; --nav:#FFFFFF; --warn:#F2B33D; --warnTxt:#14211B; --bad:#B4372E;
  --h1:#1F4D37; --h2:#2F6B4E; --h3:#7FB394; --h4:#C8DDD0; --hdot:#FFFFFF;
  --sig:#2F6B4E; --sigTxt:#FFFFFF; --uit:#F2B33D; --erin:#2F6B4E; --k2:#14211B; --k2bg:#F2B33D; --dot:#D9342B;
  --disc:#FFFFFF; --discTxt:#14211B; --discRim:#14211B;
  --f:'Archivo', 'Helvetica Neue', Helvetica, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1513; --card:#18201C; --line:#2A3530; --sub:#222B26; --ink:#ECEFEA; --mut:#A1ACA5;
  --prim:#ECEFEA; --primTxt:#0F1513; --acc:#6CC495; --accTxt:#0F1513; --soft:#1F3328; --mid:#2F5A44;
  --field:#24563E; --fieldTxt:#CFE3D7; --nav:#141B18; --bad:#F08A80;
  --h1:#9BE0B8; --h2:#6CC495; --h3:#3B7458; --h4:#26402F; --hdot:#0F1513;
  --sig:#6CC495; --sigTxt:#0F1513; --erin:#6CC495; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0F1513; --card:#18201C; --line:#2A3530; --sub:#222B26; --ink:#ECEFEA; --mut:#A1ACA5;
  --prim:#ECEFEA; --primTxt:#0F1513; --acc:#6CC495; --accTxt:#0F1513; --soft:#1F3328; --mid:#2F5A44;
  --field:#24563E; --fieldTxt:#CFE3D7; --nav:#141B18; --bad:#F08A80;
  --h1:#9BE0B8; --h2:#6CC495; --h3:#3B7458; --h4:#26402F; --hdot:#0F1513;
  --sig:#6CC495; --sigTxt:#0F1513; --erin:#6CC495; color-scheme: dark; }
/* Eigen keuze in de app wint van systeem en viewer */
:root[data-app-theme="light"] {
  --bg:#F3F4EF; --card:#FFFFFF; --line:#DCDFD6; --sub:#ECEEE8; --ink:#14211B; --mut:#56615A;
  --prim:#14211B; --primTxt:#FFFFFF; --acc:#2F6B4E; --accTxt:#FFFFFF; --soft:#E3EEE7; --mid:#A9CDB8;
  --field:#2F6B4E; --fieldTxt:#DCEBE2; --nav:#FFFFFF; --bad:#B4372E;
  --h1:#1F4D37; --h2:#2F6B4E; --h3:#7FB394; --h4:#C8DDD0; --hdot:#FFFFFF;
  --sig:#2F6B4E; --sigTxt:#FFFFFF; --erin:#2F6B4E; color-scheme: light; }
:root[data-app-theme="dark"] {
  --bg:#0F1513; --card:#18201C; --line:#2A3530; --sub:#222B26; --ink:#ECEFEA; --mut:#A1ACA5;
  --prim:#ECEFEA; --primTxt:#0F1513; --acc:#6CC495; --accTxt:#0F1513; --soft:#1F3328; --mid:#2F5A44;
  --field:#24563E; --fieldTxt:#CFE3D7; --nav:#141B18; --bad:#F08A80;
  --h1:#9BE0B8; --h2:#6CC495; --h3:#3B7458; --h4:#26402F; --hdot:#0F1513;
  --sig:#6CC495; --sigTxt:#0F1513; --erin:#6CC495; color-scheme: dark; }
/* Live modus: donkere scorebordstand (stijl A) */
.live.dk { --bg:#101417; --card:#1A2026; --line:#2A323A; --sub:#222930; --ink:#EEF0EA; --mut:#9AA3A8;
  --sig:#C6F36B; --sigTxt:#101417; --field:#1D4A36; --uit:#C6F36B; --erin:#C6F36B; --k2:#C6F36B; --k2bg:transparent; --dot:#C6F36B;
  --disc:#F4F1E8; --discTxt:#101417; --discRim:#101417; color-scheme: dark; }
.live.lt { --bg:#F3F4EF; --card:#FFFFFF; --line:#DCDFD6; --sub:#ECEEE8; --ink:#14211B; --mut:#56615A;
  --sig:#2F6B4E; --sigTxt:#FFFFFF; --field:#2F6B4E; --uit:#F2B33D; --erin:#2F6B4E; --k2:#14211B; --k2bg:#F2B33D; --dot:#D9342B; color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg); color: var(--ink); position: relative; }
.scr { padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 12px; }
.scr.flow { padding-bottom: 150px; }
.cap { font-stretch: 75%; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.h1 { margin: 0; font-stretch: 70%; font-size: 42px; font-weight: 800; text-transform: uppercase; line-height: 1; text-wrap: balance; }
.h2 { margin: 0; font-stretch: 70%; font-size: 34px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.big { font-stretch: 70%; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.muted { color: var(--mut); }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.headl { display: flex; align-items: center; gap: 12px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.tight { padding: 0; gap: 0; overflow: hidden; }
.ico { width: 44px; height: 44px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: 22px; line-height: 1; }
.btn { height: 54px; border-radius: 14px; border: 0; background: var(--prim); color: var(--primTxt); font-stretch: 75%; font-weight: 800; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; padding: 0 16px; width: 100%; }
.btn.acc { background: var(--acc); color: var(--accTxt); }
.btn.sig { background: var(--sig); color: var(--sigTxt); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); font-stretch: 100%; font-weight: 700; font-size: 15px; letter-spacing: 0; text-transform: none; }
.btn.small { height: 44px; width: auto; font-size: 14px; letter-spacing: 0; text-transform: none; font-stretch: 100%; font-weight: 700; border-radius: 22px; }
.btn.danger { background: var(--bad); color: #FFFFFF; }
.link { background: none; border: 0; color: var(--acc); font-weight: 700; padding: 10px 0; text-align: left; }
.pill { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; white-space: nowrap; }
.p-soft { background: var(--soft); color: var(--acc); }
.p-acc { background: var(--acc); color: var(--accTxt); }
.p-line { border: 1px solid var(--line); color: var(--mut); }
.p-warn { background: var(--warn); color: var(--warnTxt); }
.p-sub { background: var(--sub); color: var(--ink); }
.warn { background: var(--warn); color: var(--warnTxt); border-radius: 5px; padding: 0 5px; }
.dotw { display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--sub); border-radius: 12px; padding: 4px; }
.seg button { height: 42px; border-radius: 9px; border: 0; background: transparent; color: var(--mut); font-size: 14px; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.steps span { height: 5px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--acc); }
.disc { width: 46px; height: 46px; border-radius: 23px; background: var(--disc); color: var(--discTxt); border: 3px solid var(--discRim); box-shadow: 0 3px 0 rgba(0,0,0,.22); display: inline-flex; align-items: center; justify-content: center; font-stretch: 75%; font-weight: 800; font-size: 20px; flex: none; font-variant-numeric: tabular-nums; }
.disc.sm { width: 40px; height: 40px; font-size: 17px; border-width: 2.5px; box-shadow: none; }
.disc.lg { width: 72px; height: 72px; font-size: 34px; border-width: 4px; }
.disc.off { background: transparent; color: var(--mut); border: 2px dashed var(--mut); box-shadow: none; }
.disc.uit { border: 3px dashed var(--uit); }
.disc.sel { box-shadow: 0 0 0 4px var(--warn); }

/* Menubalk */
.nav { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; bottom: 0; background: var(--nav); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--mut); padding: 0; }
.nav button.on { color: var(--acc); font-weight: 700; }
.nav .mid { width: 56px; height: 56px; border-radius: 28px; background: var(--acc); color: var(--accTxt); display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 0 0 5px var(--bg); }
.bar { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; bottom: 0; background: var(--nav); border-top: 1px solid var(--line); padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 20; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* Wedstrijdkaart met veldmotief */
.match { border-radius: 18px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.match .top { position: relative; background: var(--field); color: #FFFFFF; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.match .top svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.match .top > *:not(svg) { position: relative; }
.match .bot { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.vs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 6px; }

/* Lijsten */
.li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--sub); background: none; width: 100%; text-align: left; min-height: 56px; }
.li:last-child { border-bottom: 0; }
.mbar { width: 96px; height: 6px; border-radius: 3px; background: var(--sub); position: relative; overflow: hidden; }
.mbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); }
.mbar i.w { background: var(--warn); }
.prog { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; width: 100%; text-align: left; }
.prog.next { border: 2px solid var(--acc); }
.date { width: 50px; display: flex; flex-direction: column; align-items: center; padding-right: 12px; border-right: 1px solid var(--line); flex: none; }

/* Afmelden */
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pk { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 4px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
.pk[aria-pressed="true"] { background: var(--sub); border: 1.5px dashed var(--line); }
.pk .nm { font-weight: 700; font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Tijdlijn */
.tl { overflow-x: auto; }
.tlg { display: grid; gap: 4px; align-items: center; min-width: 100%; }
.tlh { font-stretch: 75%; font-weight: 700; font-size: 11px; letter-spacing: .04em; color: var(--mut); text-align: center; white-space: nowrap; }
.cel { height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-stretch: 75%; font-weight: 800; font-size: 13px; background: var(--soft); color: var(--acc); }
.cel.b { background: transparent; border: 1.5px dashed var(--line); }
.cel.h2s { margin-left: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 5px 11px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); }
.blocks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.blocks button { min-width: 72px; flex: 1 0 72px; height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.blocks button[aria-pressed="true"] { background: var(--acc); color: var(--accTxt); border-color: var(--acc); }

/* Veld */
.pitch { position: relative; width: 100%; aspect-ratio: 350 / 380; max-width: 100%; border-radius: 18px; background: var(--field); overflow: hidden; }
.pitch > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pl { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; }
.pl .lb { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #FFFFFF; color: #14211B; white-space: nowrap; }
.live .pl .lb { background: rgba(10,14,16,.78); color: #FFFFFF; }
.benchrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bench { font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 99px; border: 1.5px dashed var(--line); background: transparent; }
.bench.sel { border: 2px solid var(--warn); background: var(--sub); }

/* Live */
.live { background: var(--bg); color: var(--ink); min-height: 100%; }
.clockrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.k1 { font-size: 66px; line-height: .95; }
.k2 { font-size: 38px; color: var(--k2); background: var(--k2bg); padding: 0 6px; border-radius: 6px; }
.k2.nu { animation: puls 1s ease-in-out infinite; }
@keyframes puls { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .k2.nu { animation: none; text-decoration: underline; } }
.lbar { display: flex; gap: 4px; align-items: center; }
.lbar span { height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; flex: 1; }
.lbar span i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sig); }
.lbar b { width: 2px; height: 14px; background: var(--mut); flex: none; }

/* Inzicht */
.hm { display: grid; gap: 4px; align-items: center; }
.hc { height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--hdot); }
.hc.x { border: 1.5px dashed var(--line); color: var(--mut); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .big { font-size: 32px; }
.bars { display: grid; gap: 10px; align-items: end; height: 110px; }
.bars div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.bars i { width: 100%; border-radius: 6px 6px 0 0; background: var(--acc); display: block; }
.bars i.w { background: var(--warn); }
.split { display: flex; height: 30px; border-radius: 8px; overflow: hidden; gap: 2px; }
.split div { display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }

/* Formulieren en sheets */
.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px; border-bottom: 1px solid var(--sub); }
.set:last-child { border-bottom: 0; }
.set label { font-size: 15px; }
.set input, .set select { max-width: 55%; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; text-align: right; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-size: 13px; font-weight: 700; color: var(--mut); }
.fld input, .fld select, .fld textarea { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; width: 100%; min-width: 0; }
.fld textarea { height: 120px; padding: 10px 12px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.f2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.switch { width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; flex: none; display: flex; align-items: center; background: var(--line); justify-content: flex-start; }
.switch[aria-checked="true"] { background: var(--acc); justify-content: flex-end; }
.switch span { width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.veil { position: fixed; inset: 0; background: rgba(8,12,10,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--bg); color: var(--ink); border-radius: 22px 22px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.note { font-size: 13px; color: var(--mut); line-height: 1.45; }

/* Feedback testronde */
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; }
.opt[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--accTxt); }
.opts.schaal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.opts.nps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.opts.schaal .opt, .opts.nps .opt { padding: 0; border-radius: 12px; font-stretch: 75%; font-weight: 800; font-size: 18px; }
.lg { display: flex; justify-content: space-between; font-size: 12px; color: var(--mut); margin-top: 6px; }
.fbq { display: flex; flex-direction: column; gap: 8px; }
.fbl { font-weight: 700; font-size: 15px; line-height: 1.35; }
.fld textarea.tx { height: 96px; font-family: inherit; font-size: 15px; }
.metsheet .toast { top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; }
.empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 24px 16px; text-align: center; color: var(--mut); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.banner { background: var(--soft); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
/* Welkomstscherm voor testers */
.wk { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
.wk-top { position: relative; background: var(--field); color: #FFFFFF; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 22px; overflow: hidden; display: flex; flex-direction: column; gap: 18px; min-height: 210px; }
.wk-top > svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wk-top > *:not(.bg) { position: relative; }
.wk-bar { display: flex; justify-content: space-between; align-items: center; }
.wk-dots { display: flex; gap: 6px; }
.wk-dots span { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); transition: width .2s; }
.wk-dots span.on { width: 22px; background: #FFFFFF; }
.wk-skip { background: none; border: 0; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 10px 0 10px 12px; opacity: .9; }
.wk-hero { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.wk-hero .h1 { color: #FFFFFF; }
.wk-slogan { font-stretch: 75%; font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--fieldTxt); }
.wk-discs { display: flex; gap: 8px; }
.wk-discs .disc { --disc:#FFFFFF; --discTxt:#14211B; --discRim:#14211B; }
.wk-body { flex: 1; padding: 22px 20px 150px; display: flex; flex-direction: column; gap: 14px; }
.wk-lead { font-size: 17px; line-height: 1.5; margin: 0; }
.wk-rows { display: flex; flex-direction: column; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }

  S.spelers.forEach(function (p) { res[p.id] = { min: 0, eerlijk: 0, wed: 0, bank: 0, keeper: 0, V: 0, M: 0, A: 0, vast: false, perWed: [] }; });
  gesorteerd().forEach(function (w) {
    if (!w.opgeslagen || (fase !== 'alle' && w.fase !== fase)) return;
    (w.resultaat || []).forEach(function (r) {
      var o = res[r.id]; if (!o) return;
      o.min += r.min; o.eerlijk += r.eerlijk; o.wed++; if (r.startBank) o.bank++; o.keeper += r.keeper; o.V += r.V; o.M += r.M; o.A += r.A; if (r.vast) o.vast = true;
      o.perWed.push({ id: w.id, datum: w.datum, min: r.min, bank: r.startBank });
    });
  });
  Object.keys(res).forEach(function (id) { var o = res[id]; o.pct = o.eerlijk > 0 ? o.min / o.eerlijk : null; });
  return res;
}
